[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hitran-mcp"
dynamic = ["version"]
description = "HITRAN spectroscopy toolkit for AI agents: MCP server (14 tools) + HitranLink desktop GUI"
readme = "README.en.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "LKF0402" }]
keywords = ["hitran", "spectroscopy", "mcp", "tdlas", "absorption", "cross-section"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "hitran-api==1.3.0.0",
    "numpy==2.0.1",
    "matplotlib==3.9.1",
    "Pillow==11.0.0",
]

[project.optional-dependencies]
accelerate = ["hapi2>=0.2.1", "numba>=0.60"]

[project.urls]
Homepage = "https://github.com/LKF0402/hitran-mcp"
Repository = "https://github.com/LKF0402/hitran-mcp"

[project.scripts]
hitran-mcp = "tools.hitran_mcp:main"
hitran-cli = "tools.hitran_cli:main"
hitranlink = "app.hitran_app:main"

[tool.setuptools]
packages = ["tools", "app"]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "tools.hitran_mcp.VERSION" }

[tool.setuptools.package-data]
tools = ["*.txt"]
