name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hitran-api numpy matplotlib

    - name: Syntax check
      run: |
        python -m py_compile tools/hitran.py
        python -m py_compile tools/hitran_mcp.py
        python -m py_compile app/hitran_app.py

    - name: MCP Server selftest
      run: |
        python tools/hitran_mcp.py --selftest

    - name: Desktop GUI selftest
      run: |
        python app/hitran_app.py --selftest selftest.json
