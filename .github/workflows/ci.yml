name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyflakes==3.2.0

    - name: Syntax check
      run: |
        python -m py_compile tools/hitran.py
        python -m py_compile tools/hitran_mcp.py
        python -m py_compile tools/contract_check.py
        python -m py_compile tools/security_check.py
        python -m py_compile app/hitran_app.py
        python -m py_compile app/updater.py

    - name: Static check
      run: |
        python -m pyflakes tools/hitran.py tools/hitran_mcp.py tools/contract_check.py tools/security_check.py app/hitran_app.py app/updater.py

    - name: Unit tests
      run: |
        python -m unittest discover -s tests -v

    - name: Contract check
      run: |
        python tools/contract_check.py

  security:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Secret / privacy / release gate
      run: |
        python tools/security_check.py
